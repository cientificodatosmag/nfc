name: Compilar APK Android Nativo NFC

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Preparar carpeta web (www)
        run: |
          mkdir -p www
          cp index.html app.js nfc-bridge.js styles.css manifest.json sw.js www/

      - name: Instalar dependencias
        run: npm install

      - name: Inicializar Capacitor y agregar Android
        run: |
          npx cap init "NFC Tag Master" "com.appnfc.master" --web-dir "www"
          npx cap add android
          npx cap sync android

      - name: Diagnóstico del proyecto Android generado
        run: |
          echo "===== capacitor.config.json ====="
          cat capacitor.config.json
          echo "===== android/app/src/main/assets ====="
          ls -la android/app/src/main/assets/
          echo "===== capacitor.plugins.json ====="
          cat android/app/src/main/assets/capacitor.plugins.json || echo "(no existe)"
          echo "===== native-bridge.js (inicio) ====="
          head -c 400 android/app/src/main/assets/native-bridge.js || echo "(no existe)"
          echo ""
          echo "===== assets/public ====="
          ls -la android/app/src/main/assets/public/

      - name: Verificar que el APK tendrá puente nativo y plugin NFC
        run: |
          # Sin native-bridge.js no existe window.Capacitor.registerPlugin y la
          # app queda sin acceso nativo, pero el APK compila igual: hay que
          # cortar aquí y no descubrirlo en el telefono.
          test -s android/app/src/main/assets/native-bridge.js \
            || { echo "FALTA native-bridge.js: el APK no tendria puente Capacitor"; exit 1; }
          grep -q "NfcNative" android/app/src/main/assets/capacitor.plugins.json \
            || { echo "El plugin NfcNative no esta registrado en capacitor.plugins.json"; exit 1; }
          grep -q "nfc-bridge.js" android/app/src/main/assets/public/index.html \
            || { echo "index.html empaquetado sin nfc-bridge.js"; exit 1; }
          grep -q "capacitor-nfc-native" android/capacitor.settings.gradle \
            || { echo "El modulo Gradle del plugin no quedo enlazado"; exit 1; }

      - name: Compilar APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Subir APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: NFC-Tag-Master-Release.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
