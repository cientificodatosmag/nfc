name: Compilar APK Android Nativo NFC

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Preparar carpeta web (www)
        run: |
          mkdir -p www
          cp index.html app.js nfc-bridge.js styles.css manifest.json sw.js www/

      - name: Instalar dependencias
        run: npm install

      - name: Inicializar Capacitor y agregar Android
        run: |
          npx cap init "NFC Tag Master" "com.appnfc.master" --web-dir "www"
          npx cap add android
          npx cap sync android

      - name: Verificar que el plugin NFC nativo quedó enlazado
        run: grep -q "capacitor-nfc-native" android/capacitor.settings.gradle

      - name: Compilar APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Subir APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: NFC-Tag-Master-Release.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
