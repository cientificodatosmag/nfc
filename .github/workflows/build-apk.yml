name: Compilar APK Android Nativo NFC

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Capacitor CLI y generar APK
        run: |
          npm install -g @capacitor/cli @capacitor/core @capacitor/android
          npx cap init "NFC Tag Master" "com.appnfc.master" --web-dir "."
          npx cap add android
          npx cap copy android
          cd android && ./gradlew assembleDebug

      - name: Subir APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: NFC-Tag-Master-Release.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
