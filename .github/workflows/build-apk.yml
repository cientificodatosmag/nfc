name: Compilar APK Android Nativo NFC

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Varios commits seguidos lanzaban un build cada uno y todos competian por la
# misma descarga. Solo interesa el ultimo, asi que el nuevo cancela al anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cachear Gradle entre ejecuciones
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Preparar carpeta web (www)
        run: |
          mkdir -p www
          cp index.html app.js nfc-bridge.js styles.css manifest.json sw.js modulos.json www/

      - name: Instalar dependencias
        run: npm install

      - name: Inicializar Capacitor y agregar Android
        run: |
          npx cap init "NFC Tag Master" "com.appnfc.master" --web-dir "www"
          npx cap add android
          npx cap sync android

          # La plantilla de Capacitor pide la distribucion "-all" (~200 MB):
          # trae fuentes y javadoc que solo sirven al autocompletado de Android
          # Studio. La "-bin" compila igual con la mitad de descarga.
          sed -i 's/-all\.zip/-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Diagnóstico del proyecto Android generado
        run: |
          echo "===== capacitor.config.json ====="
          cat capacitor.config.json
          echo "===== versiones de Capacitor ====="
          node -e "for (const p of ['@capacitor/core','@capacitor/cli','@capacitor/android']) console.log(p, require(p + '/package.json').version)"
          echo "===== native-bridge.js dentro de node_modules ====="
          find node_modules/@capacitor -maxdepth 3 -name 'native-bridge.js'
          echo "===== native-bridge.js dentro de android/ ====="
          find android -name 'native-bridge.js'
          echo "===== android/app/src/main/assets ====="
          ls -la android/app/src/main/assets/ || echo "(no existe)"
          echo "===== capacitor.plugins.json ====="
          cat android/app/src/main/assets/capacitor.plugins.json || echo "(no existe)"
          echo "===== assets/public ====="
          ls -la android/app/src/main/assets/public/ || echo "(no existe)"

      - name: Publicar native-bridge.js como recurso alcanzable
        run: |
          # Define window.Capacitor.registerPlugin. Normalmente llega al APK por
          # los assets del modulo capacitor-android, asi que faltar aqui no es
          # un error. Se copia ademas a public/ para que la app pueda cargarlo
          # por URL si la inyeccion del puente no ocurrio.
          ASSETS=android/app/src/main/assets
          mkdir -p "$ASSETS/public"

          echo "--- donde aparece native-bridge.js ---"
          find node_modules -name 'native-bridge.js' || true
          find android -name 'native-bridge.js' || true

          if [ ! -s "$ASSETS/native-bridge.js" ]; then
            SRC=$(find node_modules -name 'native-bridge.js' | head -1)
            if [ -n "$SRC" ]; then
              echo "Copiando desde $SRC"
              cp "$SRC" "$ASSETS/native-bridge.js"
            fi
          fi

          if [ -s "$ASSETS/native-bridge.js" ]; then
            cp "$ASSETS/native-bridge.js" "$ASSETS/public/native-bridge.js"
            wc -c "$ASSETS/native-bridge.js"
          else
            echo "AVISO: no se encontro el archivo; se confia en los assets de capacitor-android"
          fi

      - name: Verificar plugin y web empaquetados
        run: |
          grep -q "NfcNative" android/app/src/main/assets/capacitor.plugins.json \
            || { echo "El plugin NfcNative no esta registrado en capacitor.plugins.json"; exit 1; }
          grep -q "nfc-bridge.js" android/app/src/main/assets/public/index.html \
            || { echo "index.html empaquetado sin nfc-bridge.js"; exit 1; }
          grep -q "capacitor-nfc-native" android/capacitor.settings.gradle \
            || { echo "El modulo Gradle del plugin no quedo enlazado"; exit 1; }

      - name: Compilar APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Subir APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: NFC-Tag-Master-Release.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
