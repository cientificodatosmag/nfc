name: Compilar APK Android Nativo NFC

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Varios commits seguidos lanzaban un build cada uno y todos competian por la
# misma descarga. Solo interesa el ultimo, asi que el nuevo cancela al anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cachear Gradle entre ejecuciones
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Preparar carpeta web (www)
        env:
          NFC_APP_KEY: ${{ secrets.NFC_APP_KEY }}
        run: |
          mkdir -p www
          cp index.html app.js nfc-bridge.js styles.css manifest.json sw.js modulos.json config.js sync.js www/

          # La llave se inyecta aqui y no se versiona: el repositorio es publico.
          #
          # Conviene no engañarse sobre lo que esto consigue: la llave acaba
          # dentro del APK y un `unzip` la revela. Sirve de filtro, no de
          # secreto. Lo que protege el historico es que la base solo crezca y
          # que borrar exija NFC_ADMIN_KEY, que nunca sale de Vercel.
          if [ -n "$NFC_APP_KEY" ]; then
            node -e "
              const fs = require('fs');
              const ruta = 'www/config.js';
              const antes = fs.readFileSync(ruta, 'utf8');
              const despues = antes.replace(\"appKey: ''\", 'appKey: ' + JSON.stringify(process.env.NFC_APP_KEY));
              if (antes === despues) { console.error('No se encontro donde poner la llave en config.js'); process.exit(1); }
              fs.writeFileSync(ruta, despues);
            "
            if grep -q "appKey: ''" www/config.js; then
              echo "La llave quedo vacia despues de inyectarla"
              exit 1
            fi
            echo "Llave inyectada en www/config.js"
          else
            echo "AVISO: sin secreto NFC_APP_KEY. El APK grabara etiquetas pero no sincronizara."
          fi

          # Y nunca al reves: si la llave llegara al repositorio, estaria
          # publicada en internet desde el mismo commit.
          grep -q "appKey: ''" config.js \
            || { echo "config.js versionado trae una llave dentro. El repositorio es publico."; exit 1; }

      # Antes de compilar nada: la logica de doble pasada y la migracion del
      # avance guardado. Las pruebas extraen las funciones reales de app.js, asi
      # que renombrar una tambien falla aqui.
      - name: Probar la logica de rotulado
        run: node tests/rotulado.test.mjs

      - name: Instalar dependencias
        run: npm install

      # La proyeccion del registro compartido: si dejara de ser conmutativa,
      # dos telefonos sincronizando mostrarian cosas distintas.
      - name: Probar la logica del backend
        run: node tests/backend.test.mjs

      # La que mas importa de las tres: compara la fusion del cliente contra la
      # proyeccion del servidor. Si se separan, un telefono muestra una cosa y
      # la base otra, y nadie sabe cual creer.
      - name: Probar que cliente y servidor fusionan igual
        run: node tests/sync.test.mjs

      - name: Inicializar Capacitor y agregar Android
        run: |
          npx cap init "NFC Tag Master" "com.appnfc.master" --web-dir "www"
          npx cap add android
          npx cap sync android

          # La plantilla de Capacitor pide la distribucion "-all" (~200 MB):
          # trae fuentes y javadoc que solo sirven al autocompletado de Android
          # Studio. La "-bin" compila igual con la mitad de descarga.
          sed -i 's/-all\.zip/-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Diagnóstico del proyecto Android generado
        run: |
          echo "===== capacitor.config.json ====="
          cat capacitor.config.json
          echo "===== versiones de Capacitor ====="
          node -e "for (const p of ['@capacitor/core','@capacitor/cli','@capacitor/android']) console.log(p, require(p + '/package.json').version)"
          echo "===== native-bridge.js dentro de node_modules ====="
          find node_modules/@capacitor -maxdepth 3 -name 'native-bridge.js'
          echo "===== native-bridge.js dentro de android/ ====="
          find android -name 'native-bridge.js'
          echo "===== android/app/src/main/assets ====="
          ls -la android/app/src/main/assets/ || echo "(no existe)"
          echo "===== capacitor.plugins.json ====="
          cat android/app/src/main/assets/capacitor.plugins.json || echo "(no existe)"
          echo "===== assets/public ====="
          ls -la android/app/src/main/assets/public/ || echo "(no existe)"

      - name: Publicar native-bridge.js como recurso alcanzable
        run: |
          # Define window.Capacitor.registerPlugin. Normalmente llega al APK por
          # los assets del modulo capacitor-android, asi que faltar aqui no es
          # un error. Se copia ademas a public/ para que la app pueda cargarlo
          # por URL si la inyeccion del puente no ocurrio.
          ASSETS=android/app/src/main/assets
          mkdir -p "$ASSETS/public"

          echo "--- donde aparece native-bridge.js ---"
          find node_modules -name 'native-bridge.js' || true
          find android -name 'native-bridge.js' || true

          if [ ! -s "$ASSETS/native-bridge.js" ]; then
            SRC=$(find node_modules -name 'native-bridge.js' | head -1)
            if [ -n "$SRC" ]; then
              echo "Copiando desde $SRC"
              cp "$SRC" "$ASSETS/native-bridge.js"
            fi
          fi

          if [ -s "$ASSETS/native-bridge.js" ]; then
            cp "$ASSETS/native-bridge.js" "$ASSETS/public/native-bridge.js"
            wc -c "$ASSETS/native-bridge.js"
          else
            echo "AVISO: no se encontro el archivo; se confia en los assets de capacitor-android"
          fi

      - name: Verificar plugin y web empaquetados
        run: |
          # Un <script> que no se copio a www/ produce una app que funciona
          # perfecto en el navegador y esta muerta dentro del APK. Es el fallo
          # mas caro posible, asi que se comprueba archivo por archivo.
          FALTAN=0
          for S in $(grep -o 'script src="[^"]*"' index.html | cut -d'"' -f2); do
            case "$S" in http*) continue;; esac
            if [ ! -f "android/app/src/main/assets/public/$S" ]; then
              echo "index.html carga $S pero no llego al APK (falta en la lista cp de www/)"
              FALTAN=1
            fi
          done
          [ "$FALTAN" = "0" ] || exit 1

          grep -q "NfcNative" android/app/src/main/assets/capacitor.plugins.json \
            || { echo "El plugin NfcNative no esta registrado en capacitor.plugins.json"; exit 1; }
          grep -q "nfc-bridge.js" android/app/src/main/assets/public/index.html \
            || { echo "index.html empaquetado sin nfc-bridge.js"; exit 1; }
          grep -q "capacitor-nfc-native" android/capacitor.settings.gradle \
            || { echo "El modulo Gradle del plugin no quedo enlazado"; exit 1; }

          # Exportar CSV depende de estos dos: sin ellos el boton vuelve a no
          # hacer nada dentro del APK, que es justo el fallo que se corrigio.
          for P in Filesystem Share; do
            grep -q "$P" android/app/src/main/assets/capacitor.plugins.json \
              || { echo "Falta el plugin $P en capacitor.plugins.json"; exit 1; }
          done

          # Lo trae la plantilla de Capacitor, pero el sincronizado futuro
          # depende de ello: mejor afirmarlo que confiar.
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml \
            || { echo "El APK no declara el permiso INTERNET"; exit 1; }

      - name: Compilar APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Subir APK como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: NFC-Tag-Master-Release.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
